# S334 (revue globale du 19/10, C7) : les actions sont épinglées par leur
# SHA ; Dependabot propose leurs mises à jour, une fois par mois. S351
# (Cédric, 22/10) : npm aussi, une PR groupée par mois, sans les versions
# majeures, qui restent à la main. Chaque PR passe la porte ; la revue de
# Cédric (CODEOWNERS) n'est imposée que si la protection de `main` l'exige
# (#209).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      mineures-et-correctifs:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
