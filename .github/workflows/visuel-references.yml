# S240 : les références des écrans figés sont produites par la CI elle-même.
# Celles du conteneur de développement différaient d'environ 10 % des
# pixels sur le runner (polices, lissage ; mesuré le 17/10). Lancé à la
# main sur une branche : il refait les captures et les committe dans cette
# branche, où elles se relisent dans le diff de la PR. Deux déclencheurs :
# à la main (une fois ce fichier sur main), ou un commit poussé sur une
# branche dont le message contient « [références visuelles] ».
name: Références visuelles

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]

permissions:
  contents: read

# S288 (relecteur de workflows) : deux jobs. Le premier exécute le code de la
# branche (`npm ci`, build, Playwright) sans droit d'écriture ni jeton gardé
# dans `.git/config` ; le second, seul à pouvoir pousser, n'exécute rien de
# la branche : il pose les captures reçues en artefact et committe.
jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.ref != 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[références visuelles]'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Build
        run: npm run build
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - name: Refaire les captures
        run: npx playwright test --update-snapshots=all --reporter=list
        timeout-minutes: 10
        env:
          CI: 'true'
          PW_VISUEL: '1'
      - name: Garder les captures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: references-visuelles
          path: tests/e2e/visuel.spec.ts-snapshots/
          retention-days: 1

  commit:
    needs: captures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deux demandes rapprochées : la seconde attend, au lieu d'un push refusé (S334).
    concurrency:
      group: references-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Poser les captures reçues
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: references-visuelles
          path: tests/e2e/visuel.spec.ts-snapshots/
      - name: Committer les références
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Seulement des images : l'artefact vient du code de la branche (S334).
          git add 'tests/e2e/visuel.spec.ts-snapshots/*.png'
          if git diff --cached --quiet; then
            echo 'Références inchangées.'
          else
            git commit -m 'S240 : références visuelles produites par la CI'
            git push
          fi
