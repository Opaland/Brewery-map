name: CI et déploiement

# Une seule chaîne : lint → tsc → tests → build → e2e → déploiement → sonde.
# Le déploiement ne part que de `main`, et seulement si la porte est verte :
# deux workflows séparés (comme sur Sentiers) laissaient publier un `main`
# dont la CI était rouge.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  porte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck (tsc -b, pas tsc --noEmit)
        run: npx tsc -b --noEmit
      - name: Tests unitaires (dont data/breweries.json contre le schéma)
        run: npx vitest run
      - name: Build (échoue si les données importées sont invalides)
        run: npm run build
      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - name: Tests e2e
        run: npx playwright test
        timeout-minutes: 30
        env:
          CI: 'true'
      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Publier dist/ pour Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploiement:
    needs: porte
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # La seule sonde qui regarde ce que les gens voient vraiment (Sentiers) :
  # un déploiement vert ne prouve pas que la page publiée fonctionne.
  page-publiee:
    needs: deploiement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Sonder la page publiée
        env:
          MOUSSE_URL: ${{ needs.deploiement.outputs.page_url }}
          CI: 'true'
        run: npx playwright test tests/e2e/page-deployee.spec.ts
