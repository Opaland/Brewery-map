name: CI et déploiement

# Une seule chaîne : lint → tsc → tests → build → e2e → déploiement → sonde.
# Le déploiement ne part que de `main`, et seulement si la porte est verte :
# deux workflows séparés (comme sur Sentiers) laissaient publier un `main`
# dont la CI était rouge.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push plus récent annule le run d'une branche ; jamais sur `main`, où un
# second merge annulait la sonde de la page déjà publiée (S288, relecteur de
# workflows ; CLAUDE.md §7).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  porte:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # La garde de data/ relit le fichier du 15/10 dans l'historique (S230).
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Garde de data/ (aucune ligne sans accord écrit de Cédric)
        run: npx tsx outils/garde-donnees.ts
      # S283 : bloquant pour ce que la page embarque (faille haute ou
      # critique) ; l'arbre entier, outils compris, est lu sans bloquer — un
      # avis « modéré » sur un outil ne rougit pas une PR sans rapport.
      # Limite dite : registre npm injoignable, l'audit sort en erreur et la
      # porte rougit sans faille (mesuré, revue adverse S283) ; relancer.
      - name: Audit des dépendances livrées (bloquant, haute et critique)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit de l'arbre entier (informatif)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Lint
        run: npm run lint
      - name: Typecheck (tsc -b, pas tsc --noEmit)
        run: npx tsc -b --noEmit
      - name: Tests unitaires (dont data/breweries.json contre le schéma)
        run: npx vitest run
      - name: Build (échoue si les données importées sont invalides)
        run: npm run build
      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - name: Tests e2e
        run: npx playwright test
        timeout-minutes: 30
        env:
          CI: 'true'
      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Publier dist/ pour Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # S234 : la même suite sur Safari d'iPhone (WebKit) et Firefox. Informatif
  # tant que ses échecs ne sont pas triés (docs/NAVIGATEURS.md) : il ne
  # bloque ni la porte ni le déploiement.
  navigateurs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        navigateur: [webkit, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Build
        run: npm run build
      - name: Installer ${{ matrix.navigateur }}
        run: npx playwright install --with-deps ${{ matrix.navigateur }}
        timeout-minutes: 10
      - name: Tests e2e sur ${{ matrix.navigateur }}
        run: npx playwright test --reporter=list,html
        timeout-minutes: 30
        env:
          CI: 'true'
          PW_NAVIGATEUR: ${{ matrix.navigateur }}
      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.navigateur }}
          path: playwright-report/
          retention-days: 7

  # S240 : cinq écrans figés, comparés à des références produites dans le
  # conteneur de développement. Informatif tant que la première mesure n'a
  # pas dit si le rendu du runner est le même (docs/stories/S240.md).
  visuel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Build
        run: npm run build
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - name: Écrans figés
        # Sans nouvel essai : un écran instable doit se voir, pas passer en
        # « flaky » vert (revue adverse S240).
        run: npx playwright test --reporter=list --retries=0
        timeout-minutes: 10
        env:
          CI: 'true'
          PW_VISUEL: '1'
      - name: Différences en cas d'échec
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visuel-differences
          path: test-results/
          retention-days: 7

  deploiement:
    needs: porte
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      # Une publication en cours n'est pas coupée par la suivante : elle
      # attend son tour (S334, revue globale du 19/10, C8).
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # La seule sonde qui regarde ce que les gens voient vraiment (Sentiers) :
  # un déploiement vert ne prouve pas que la page publiée fonctionne.
  page-publiee:
    needs: deploiement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      # L'empreinte du build de ce commit : la sonde vérifie que c'est bien
      # lui que Pages sert, et non une version d'avant (S334, revue globale
      # du 19/10, C9). Le build est reproductible : mêmes noms, même empreinte.
      - name: Empreinte du build de ce commit
        run: |
          npm run build
          E=$(node -e "process.stdout.write(/const EMPREINTE = '([0-9a-f]+)'/.exec(require('fs').readFileSync('dist/sw.js','utf8'))[1])")
          # Vide, la sonde se tairait : l'étape échoue (revue adverse S334).
          test -n "$E"
          echo "MOUSSE_EMPREINTE=$E" >> "$GITHUB_ENV"
      - name: Sonder la page publiée
        env:
          MOUSSE_URL: ${{ needs.deploiement.outputs.page_url }}
          CI: 'true'
        run: npx playwright test tests/e2e/page-deployee.spec.ts
