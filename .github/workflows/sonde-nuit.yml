name: Sonde des services (nuit)

# S277 : chaque nuit, la page publiée, les tuiles de la carte et les services
# des outils de curation (outils/services-sondes.ts), un à la fois. Le bilan
# nomme l'hôte en panne, dans le résumé du run. Informatif : aucune PR ne
# l'attend ; un run rouge le matin dit qu'un service est tombé, pas le code.
#
# 25/10 : la planification de nuit est retirée, à la demande de Cédric
# (« désactiver les workflows de nuit »). La sonde se lance à la main :
# Actions → « Sonde des services (nuit) » → Run workflow, ou
# `gh workflow run sonde-nuit.yml`.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Sonder les services
        run: npx tsx outils/sonde-services.ts

  # S283 : chaque nuit, un avis nouveau sur une dépendance (outils compris)
  # rougit le run du matin, sans attendre une PR.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Audit des dépendances (haute et critique)
        run: npm audit --audit-level=high
