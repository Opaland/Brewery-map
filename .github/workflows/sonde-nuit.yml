name: Sonde des services (nuit)

# S277 : à la demande (la nuit jusqu’au 25/10), la page publiée, les tuiles
# de la carte et les services des outils de curation (outils/services-sondes.ts), un à la fois. Le bilan
# nomme l'hôte en panne, dans le résumé du run. Informatif : aucune PR ne
# l'attend ; un run rouge dit qu'un service est tombé, pas le code.
#
# 25/10 : la planification de nuit est retirée, à la demande de Cédric
# (« désactiver les workflows de nuit »). La sonde se lance à la main :
# Actions → « Sonde des services (nuit) » → Run workflow, ou
# `gh workflow run sonde-nuit.yml`.
#
# 31/10 (#226, décision de Cédric) : le job `audit`, et lui seul, repart
# chaque semaine, le lundi à 6 h UTC ; le job `sonde` reste à la main.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  sonde:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Sonder les services
        run: npx tsx outils/sonde-services.ts

  # S283 : un avis nouveau sur une dépendance (outils compris) rougit ce job.
  # `ci.yml` audite aussi l'arbre entier, mais sans rougir : c'est ici que
  # l'avis se voit. Chaque semaine depuis le 31/10 (#226).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Audit des dépendances (haute et critique)
        run: npm audit --audit-level=high
