name: Mutation (nuit)

# S239 : Stryker sur src/core, chaque nuit et à la demande. Informatif : le
# rapport liste les mutants survivants (tests creux, CLAUDE.md §6bis) ; il ne
# bloque rien. Stryker s'installe pour le job seulement (--no-save) : son
# ajout au fichier de verrouillage cassait `npm ci` (S239).

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Installer Stryker (pour ce job seulement)
        run: npm install --no-save --legacy-peer-deps @stryker-mutator/core@10.0.0 @stryker-mutator/vitest-runner@10.0.0
      - name: Mutation de src/core
        run: npx stryker run
      - name: Garder le rapport
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-mutation
          path: reports/mutation/
          retention-days: 30
